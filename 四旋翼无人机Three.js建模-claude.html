  <body>
    <div id="stage">
      <canvas id="viewport"></canvas>
      <div id="labels"></div>
    </div>

    <header id="titlecard">
      <h1>四旋翼无人机</h1>
      <p>Three.js 程序化建模 · Three.js 单文件分发版 · 程序化建模</p>
      <dl id="metrics">
        <div><dt>机身全长</dt><dd>183 mm</dd></div>
        <div><dt>电机轴距</dt><dd>280 × 212 mm</dd></div>
        <div><dt>桨盘直径</dt><dd>190 mm</dd></div>
        <div><dt>布局</dt><dd>X 型四旋翼</dd></div>
      </dl>
    </header>

    <aside id="panel">
      <section>
        <h2>运动</h2>
        <label class="slider">
          <span>旋翼转速<em id="v-rpm">0 rpm</em></span>
          <input id="c-rpm" type="range" min="0" max="100" value="0" />
        </label>
        <label class="slider">
          <span>云台俯仰<em id="v-pitch">0°</em></span>
          <input id="c-pitch" type="range" min="-90" max="30" value="0" />
        </label>
        <label class="slider">
          <span>云台偏航<em id="v-yaw">0°</em></span>
          <input id="c-yaw" type="range" min="-60" max="60" value="0" />
        </label>
        <label class="switch">
          <input id="c-hover" type="checkbox" />
          <span>悬停姿态动画</span>
        </label>
      </section>

      <section>
        <h2>视图</h2>
        <div class="views">
          <button data-view="iso">轴测</button>
          <button data-view="front">正视</button>
          <button data-view="side">侧视</button>
          <button data-view="top">俯视</button>
          <button data-view="back">背视</button>
          <button data-view="detail">特写</button>
        </div>
        <label class="switch">
          <input id="c-orbit" type="checkbox" />
          <span>自动环绕</span>
        </label>
      </section>

      <section>
        <h2>显示</h2>
        <label class="slider">
          <span>爆炸视图<em id="v-explode">0%</em></span>
          <input id="c-explode" type="range" min="0" max="100" value="0" />
        </label>
        <label class="switch"><input id="c-ground" type="checkbox" checked /><span>地面与网格</span></label>
        <label class="switch"><input id="c-axes" type="checkbox" /><span>机体坐标系</span></label>
        <label class="switch"><input id="c-spin" type="checkbox" /><span>旋翼转向</span></label>
        <label class="switch"><input id="c-annot" type="checkbox" /><span>部件标注</span></label>
        <label class="switch"><input id="c-wire" type="checkbox" /><span>线框模式</span></label>
      </section>

      <section>
        <button id="c-shot" class="primary">导出当前视图 PNG</button>
      </section>
    </aside>

    <footer id="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移</footer>

  </body>
</html>
